[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "md2doc-studio"
version = "0.2.3"
description = "MD2DOC Format 0.1/0.2 project to editable DOCX converter"
requires-python = ">=3.12"
dependencies = [
  "python-docx==1.2.0",
  "markdown-it-py==4.0.0",
  "PyYAML==6.0.3",
  "Pillow==12.0.0",
  "lxml==6.1.3",
  "defusedxml==0.7.1",
]

[project.optional-dependencies]
svg = ["CairoSVG==2.8.2"]
test = ["pytest==9.0.2"]

[project.scripts]
md2doc = "md2doc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
